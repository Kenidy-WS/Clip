<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clip">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Clip</title>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --line:#262c36; --fg:#f2f4f8; --mut:#9aa4b2; --red:#e53935; --ok:#2ea043; --warn:#d29922; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system, system-ui, sans-serif; }
  .stage { position:relative; height:100vh; height:100dvh; display:flex; flex-direction:column; padding:env(safe-area-inset-top) 0 0; }
  .view { position:relative; flex:1; min-height:0; background:#000; }
  video#preview { width:100%; height:100%; object-fit:contain; display:block; background:#000; }
  .topbar { position:absolute; left:0; right:0; top:0; display:flex; gap:8px; align-items:center; padding:10px 12px; }
  .pill { flex:1; background:rgba(14,17,22,.72); border:1px solid var(--line); border-radius:999px; padding:6px 12px; font-size:13px; position:relative; overflow:hidden; }
  .pill .fill { position:absolute; inset:0 auto 0 0; width:0; background:rgba(229,57,53,.35); transition:width .25s; }
  .pill span { position:relative; }
  .mic { position:relative; width:10px; height:36px; border-radius:5px; background:rgba(14,17,22,.72); border:1px solid var(--line); overflow:hidden; }
  .mic #micFill { position:absolute; left:0; right:0; bottom:0; height:0; background:var(--ok); transition:height .1s; }
  .icon { width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:rgba(14,17,22,.72); color:var(--fg); font-size:16px; padding:0; }
  .status { position:absolute; left:12px; right:12px; top:56px; padding:8px 12px; border-radius:10px; font-size:14px; background:rgba(14,17,22,.88); border:1px solid var(--line); display:none; }
  .status.show { display:block; }
  .status.err { border-color:var(--red); } .status.warn { border-color:var(--warn); } .status.ok { border-color:var(--ok); }
  .update { display:none; position:absolute; left:12px; right:12px; bottom:12px; z-index:5; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:12px; background:#1f6feb; box-shadow:0 4px 18px rgba(0,0,0,.45); font-size:15px; font-weight:600; }
  .update.show { display:flex; }
  .update button { background:#fff; color:#0b3d91; border:0; border-radius:9px; padding:8px 14px; font-weight:700; }
  .update button:disabled { opacity:.6; }
  pre.info { display:none; position:absolute; left:12px; right:12px; bottom:8px; margin:0; padding:8px 10px; border-radius:10px; font:11px/1.35 ui-monospace, Menlo, monospace; white-space:pre-wrap; word-break:break-all; background:rgba(14,17,22,.88); border:1px solid var(--line); color:var(--mut); max-height:45%; overflow:auto; }
  pre.info.open { display:block; }
  .controls { padding:10px 12px calc(12px + env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); }
  .opts { display:flex; gap:8px; margin-bottom:10px; }
  select, button { font:inherit; color:var(--fg); }
  select { flex:1; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px; }
  button.flip { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
  button:disabled, select:disabled { opacity:.45; }
  button.rec { width:100%; border:0; border-radius:14px; padding:16px; font-size:18px; font-weight:600; }
  button.rec.idle { background:#2f6feb; } button.rec.ready { background:var(--red); } button.rec.on { background:#fff; color:#111; } button.rec.busy { background:var(--line); }
  .below { display:flex; justify-content:center; align-items:center; gap:14px; padding:8px 0 0; }
  .ver { color:var(--mut); font-size:12px; opacity:.7; }
  button.link { background:none; border:0; color:var(--mut); font-size:14px; }
  section#clipsSection { padding:16px 12px calc(24px + env(safe-area-inset-bottom)); }
  section h2 { font-size:17px; margin:0 0 10px; }
  .clip { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:12px; }
  .clip video { width:100%; max-height:60vh; border-radius:8px; background:#000; }
  .clip .meta { color:var(--mut); font-size:13px; margin:8px 0; }
  .clip .row { display:flex; gap:8px; }
  .clip button { flex:1; background:#2f6feb; border:0; border-radius:10px; padding:10px; font-weight:600; }
  .clip button.ghost { flex:0 0 auto; background:none; border:1px solid var(--line); font-weight:400; }
  .hint { color:var(--mut); font-size:13px; }
</style>
</head>
<body>
<div class="stage">
  <div class="view">
    <video id="preview" playsinline muted autoplay></video>
    <div class="topbar">
      <div class="pill"><div class="fill" id="fill"></div><span id="bufTxt">Câmera parada</span></div>
      <div class="mic" title="Nível do microfone"><div id="micFill"></div></div>
      <button class="icon" id="btnInfo" aria-label="Diagnóstico">i</button>
    </div>
    <div id="status" class="status"></div>
    <div id="update" class="update"><span>Nova versão disponível</span><button id="btnUpdate">Atualizar</button></div>
    <pre id="info" class="info"></pre>
  </div>
  <div class="controls">
    <div class="opts">
      <select id="selBuffer" aria-label="Tamanho do buffer">
        <option value="15" selected>Buffer 15 s</option>
        <option value="30">Buffer 30 s</option>
      </select>
      <select id="selQuality" aria-label="Qualidade">
        <option value="1080" selected>1080p · 16 Mbps</option>
        <option value="720">720p · 8 Mbps</option>
      </select>
      <button class="flip" id="btnSound" aria-label="Sons de início e fim">🔊</button>
      <button class="flip" id="btnFlip" aria-label="Trocar câmera">⇄</button>
    </div>
    <button class="rec idle" id="btnRec">Iniciar câmera</button>
    <div class="below"><button class="link" id="btnClips">Clipes (0) ↓</button><span class="ver" id="ver"></span></div>
  </div>
</div>
<section id="clipsSection">
  <h2 id="clipsTitle">Clipes (0)</h2>
  <p class="hint">Os clipes ficam guardados neste app até você excluir. Toque em “Salvar / Compartilhar” → “Salvar vídeo” para mandar ao Rolo da Câmera.</p>
  <p class="hint" id="storage"></p>
  <div id="clips"></div>
</section>
<script src="vendor/mp4-muxer.js"></script>
<script src="app.js"></script>
</body>
</html>
